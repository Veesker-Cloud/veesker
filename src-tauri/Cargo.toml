[package]
name = "veesker"
version = "0.5.0-beta.3"
description = "Oracle IDE for 9i through 26ai — SQL, AI, vectors, and APIs"
authors = ["Geraldo Ferreira Viana Júnior <geraldovianajr@veesker.cloud>"]
homepage = "https://veesker.cloud"
repository = "https://github.com/veesker-cloud/veesker-community-edition"
license = "Apache-2.0"
edition = "2024"

[lib]
name = "veesker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Force the binary file to be "Veesker" (Title Case) so macOS Dock shows
# the proper app name in `tauri dev` mode (no .app bundle is built in dev,
# so the Dock falls back to the executable filename).
[[bin]]
name = "Veesker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["rt", "sync", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-openssl"] }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.23"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
zip = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
portable-pty = "0.8"
regex = "1"

[dev-dependencies]
tempfile = "3"
